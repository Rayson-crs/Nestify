appId: app.nestify.desktop
productName: Nestify
copyright: Nestify
asar: true
npmRebuild: false
directories:
  output: release
files:
  - out/**/*
  - package.json
  - resources/**/*
extraResources:
  - from: ../../config
    to: config
  - from: resources
    to: resources
win:
  icon: resources/nestify-icon.ico
  target:
    - portable
  signAndEditExecutable: false
portable:
  artifactName: Nestify.exe
electronVersion: 37.3.1
