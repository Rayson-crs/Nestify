appId: app.nestify.desktop
productName: Nestify
asar: true
compression: maximum
electronLanguages:
  - zh-CN
  - en-US
npmRebuild: false
electronDist: ../../node_modules/electron/dist
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - resources/**/*
extraResources:
  - from: ../../config
    to: config
  - from: resources
    to: resources
win:
  icon: resources/nestify-icon.ico
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
  artifactName: Nestify-v${version}.exe
portable:
  artifactName: Nestify-v${version}.exe
